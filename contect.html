<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankush-Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .c {
            color: #fe0000;
            font: weight 500px;
            font-size: 25px;
            margin-top: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .get {
            color: #ffffff;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: bolder;
            font-size: 35px;
            text-align: center;
        }

        .box1 {
            display: flex;
            justify-content: center;
            margin: 25px 0px;
            gap: 30px;
        }

        .box {
            border-radius: 5px;
            background-color: #0a3e4e4b;
            text-align: center;
            border-radius: 5px;
            padding: 30px 80px;
        }

        .box2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            justify-content: center;
            margin: 34px 1023px;
            gap: 15px;
        }

        .input {
            margin-left: 10px;
            text-align: center;
        }

        .input-id {
            background-color: #032732a1;
            color: white;
            font-size: 15px;
            border-radius: 50px;
            padding: 15px;
            margin-top: 31px;
            margin-bottom: -11px;
            width: 440px;
        }

        .type {
            background-color: #032732a1;
            color: white;
            padding-top: 12px;
            padding-left: 12px;
            border-radius: 25px;
            margin-top: 33px;
            margin-bottom: 0px;
            height: 178px;
            width: 450px;
        }

        button {
            background-color: red;
            color: white;
            border: none;
            font-size: 16px;
            border-radius: 56px;
            font-weight: bolder;
            width: 135px;
            text-align: left;
            margin-right: 2vh;
            margin-left: 2vh;
            margin-top: 5px;
            padding-left: 11px;
            padding-right: 9px;
            padding-top: 10px;
            padding-bottom: 10px;

        }

        @media only screen and (max-width: 2050px) {
            .box2 {
                margin: 20px 517px;
            }
        }

        @media only screen and (max-width: 1050px) {
            .box1 {
                font-size: 70%;

            }

            .box1 .box {
                padding: 20px 60px;
            }

            .box2 {
                margin: 30px 160px;
            }

            /* .box2 input { 
                margin-bottom: 27px;
            } */

            .input-id {
                font-size: 15px;
                width: 300px;
                padding: 10px 25px;
                margin-left: 1px;
            }

            .type {
                height: 147px;
                width: 350px;

            }

            button {
                margin-left: 13px;
            }
        }

        @media only screen and (max-width: 750px) {
            .box1 {
                display: flex;

            }

            .box1 .box {
                padding: 15px 30px;
            }

            .box2 {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin: 20px 100px;
            }

            .type {
                width: 320px;
            }

            button {
                margin-right: 21vh;
                margin-left: 127px;
            }
        }


        @media only screen and (max-width:630px) {
            .box1 {
                font-size: 50%;
            }

            button {
                margin-right: 9vh;
                margin-left: 65px;
            }

        }

        @media only screen and (max-width:550px) {
            .input-id {
                font-size: 12px;
                width: 250px;
            }

            .input {
                margin-left: 12px;
                text-align: center;
            }

            .type {
                width: 260px;
            }

            .box2 input {
                margin-bottom: 1px;
            }
        }

        @media only screen and (max-width:450px) {
            .box1 {
                display: flex;
                flex-wrap: wrap;

            }

            .box2 {
                margin: 10px 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <div class="left">Ankush's Portfolio</div>
            <div class="right">
                <ul>
                    <li> <a href="/index.html"> Home </a></li>
                    <li> <a href="/about.html"> About </a></li>
                    <li> <a href="/services.html"> Services </a></li>
                    <li> <a href="/projects.html"> Projects </a></li>
                    <li> <a href="/contect.html"> Contact Me </a></li>

                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="c">Contact</div>

        <div class="get">Get In Touch</div>

        <div class="box1">
            <div class="box">
                <img src="logo/phone-solid.svg" width="30px">
                <h3>Phone</h3>
                <p>+91 9050600830</p>
            </div>
            <div class="box">
                <img src="logo/email.svg" width="30px">
                <h3>Email Address</h3>
                <p>ankushahlawa619@gmail.com</p>
            </div>
            <div class="box">
                <img src="logo/address.svg" width="30px">
                <h3>Address</h3>
                <p>Panipat, Haryana</p>
            </div>
        </div>

        <div class="box2">
            <div class="input">
                <input class="input-id" id="name" placeholder="Name">
                <input class="input-id" id="email" placeholder="Email">
                <input class="input-id" id="subject" placeholder="Subject">
            </div>
            <textarea class="type" name="type" id="type" required placeholder="Type here..."></textarea>
            <button>Send Message</button>
        </div>


    </main>
</body>

</html>
